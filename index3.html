<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록 태그</title>
</head>
<body>
    <h1>목록 태그</h1>
    <h2>글머리 기호 목록</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>Javascript</li>
    </ul>
    <h2>순서 번호 목록</h2>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>Javascript</li>
    </ol>
    <h2>정의 목록</h2>
    <dl>
        <dt>클라이언트</dt>
        <dd>HTML</dd>
        <dd>CSS</dd>
        <dd>Javascript</dd>
        <dt>서버</dt>
        <dd>PHP</dd>
        <dd>MySQL</dd>
    </dl>
</body>
</html>
